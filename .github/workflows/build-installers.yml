name: Build Installers

on:
  push:
    branches: ["master", "main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Build service binary
        shell: bash
        run: |
          chmod +x scripts/build_service.sh
          ./scripts/build_service.sh

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build desktop installers
        working-directory: apps/desktop
        run: npm run dist

      - name: Upload artifacts (macOS DMG only)
        if: matrix.os == 'macos-latest'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: smap-installers-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
          if-no-files-found: warn

      - name: Upload artifacts (Windows)
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: smap-installers-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi
          if-no-files-found: warn

      - name: Upload artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: smap-installers-${{ matrix.os }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: warn

      - name: Publish direct mac DMG release asset
        if: matrix.os == 'macos-latest' && github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'main')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="smap-mac-latest"
          DMG_PATH="$(ls -1 apps/desktop/release/*.dmg | head -n 1)"
          ASSET_NAME="SMAP-Desktop-macOS-latest.dmg"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "SMAP macOS latest" --notes "Auto-updated latest unsigned macOS DMG."
          fi
          gh release upload "$TAG" "$DMG_PATH#$ASSET_NAME" --clobber

      - name: Send macOS DMG link to Telegram
        if: matrix.os == 'macos-latest' && github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'main')
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DMG_URL: https://github.com/${{ github.repository }}/releases/download/smap-mac-latest/SMAP-Desktop-macOS-latest.dmg
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets are missing; skipping DMG link delivery."
            exit 0
          fi
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=macOS DMG download link: ${DMG_URL}
Commit: ${GITHUB_SHA}" >/tmp/tg_send_link.json || true
          cat /tmp/tg_send_link.json || true
