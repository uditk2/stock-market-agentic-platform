[project]
name = "livegraph"
version = "0.1.0"
description = "Live NSE F&O prices overlaid on a sector/stock relationship graph."
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pydantic-ai-slim[openai]>=0.0.20",
    "httpx>=0.27",
    "pyotp>=2.9",
]

# The Kotak Neo SDK is deliberately NOT a normal dependency. It hard-pins its
# whole tree, including `websockets==8.1` (which has no Python 3.13 wheel and
# collides with uvicorn) and `asyncio==3.4.3`, a dead PyPI package that shadows
# the standard library module. Install it without its pins and supply the
# libraries it actually imports:
#
#   pip install --no-deps "neo_api_client @ git+https://github.com/Kotak-Neo/Kotak-neo-api-v2.git@v2.0.2"
#   pip install requests websocket-client pyjwt bidict python-dateutil six pyjsparser
#
# The Dockerfile does exactly this. Without it the app still runs; the live
# Kotak feed is unavailable and the simulated feed is used instead.
[project.optional-dependencies]

dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]
kotak = [
    "requests>=2.31",
    "websocket-client>=1.8",
    "pyjwt>=2.8",
    "bidict>=0.22",
    "python-dateutil>=2.8",
    "six>=1.16",
    "pyjsparser>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/livegraph"]

# The Kotak Neo SDK is not on PyPI, so it is pinned by git URL.
[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["sandbox: needs Node and the Pyodide worker deps installed"]
